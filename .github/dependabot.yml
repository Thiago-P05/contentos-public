version: 2

# A self-hosted app that stops getting dependency updates quietly rots. Grouping
# keeps the noise to roughly one PR a week per ecosystem, so a lightly
# maintained fork still receives security fixes.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Framework bumps land together — React and Next are coupled in practice.
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
