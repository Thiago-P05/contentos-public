name: Bug report
description: Something behaves differently than documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you paste anything:** scrub API keys, access tokens, your
        Supabase project ref, account handles and email addresses.

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the relevant log output or error, redacted.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit or version
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area?
      options:
        - Sync pipeline
        - OAuth / connecting accounts
        - AI analysis or transcription
        - Dashboard / library / audience UI
        - MCP server
        - Setup / migrations
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Node version, package manager, local or deployed, host.
